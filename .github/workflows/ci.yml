name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: vectorizer_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test -d vectorizer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends graphviz

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Every check runs even if an earlier one failed, so one red check
      # (e.g. Ruff) cannot hide the results of the others. Each tool pipes its
      # output through `tee` (to a log the annotation step below reads) with
      # `shell: bash` + pipefail, so the step still fails when the tool fails.
      - name: Ruff
        id: ruff
        shell: bash
        run: |
          set -o pipefail
          ruff check --output-format=github app tests | tee ruff.log

      - name: Black
        id: black
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          black --check --diff app tests 2>&1 | tee black.log

      - name: Mypy
        id: mypy
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          mypy app 2>&1 | tee mypy.log

      # Put the tool results into annotations so they can be read without
      # opening the raw log. This step never changes a result: the tool step
      # above stays red when its tool failed.
      - name: Annotate lint results
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          emit() {  # title, outcome, file
            [ "$2" = "skipped" ] && return 0
            level=notice
            [ "$2" = "failure" ] && level=error
            msg=$(head -c 3000 "$3" 2>/dev/null)
            [ -z "$msg" ] && msg="no output (outcome: $2)"
            msg="${msg//'%'/'%25'}"
            msg="${msg//$'\n'/'%0A'}"
            echo "::${level} title=$1 ($2)::${msg}"
          }
          grep -oE 'title=Ruff \([A-Z0-9]+\)' ruff.log 2>/dev/null | sort | uniq -c | sort -rn > ruff.summary || true
          grep -E '^(would reformat|[0-9]+ files? would be|All done|Oh no)' black.log 2>/dev/null > black.summary || true
          grep -E ' error: |^Found |^Success' mypy.log 2>/dev/null | head -60 > mypy.summary || true
          emit Ruff "${{ steps.ruff.outcome }}" ruff.summary
          emit Black "${{ steps.black.outcome }}" black.summary
          emit Mypy "${{ steps.mypy.outcome }}" mypy.summary

      - name: Tests
        id: tests
        if: ${{ !cancelled() }}
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5433/vectorizer_test
          # Throwaway signing key for the auth tests (tests have no .env).
          JWT_SECRET: ci-only-signing-key-not-a-secret
        run: |
          set -o pipefail
          pytest -ra --tb=short 2>&1 | tee pytest.log

      # Put the test result into annotations, so it can be read without
      # opening the raw log. Red only when the tests themselves failed.
      - name: Annotate test result
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: |
          level=notice
          if [ "${{ steps.tests.outcome }}" = "failure" ]; then level=error; fi
          {
            grep -E "^=+ .*(passed|failed|error).* =+$" pytest.log | tail -1
            echo "--- failed tests per file ---"
            grep -E "^(FAILED|ERROR) tests/" pytest.log | sed -E 's/^(FAILED|ERROR) (tests\/[^:]+).*/\1 \2/' | sort | uniq -c | sort -rn | head -40
            echo "--- failure reasons (first 90 chars) ---"
            grep -E "^(FAILED|ERROR) tests/" pytest.log | sed -E 's/^[^ ]+ [^ ]+( - )?//' | cut -c1-90 | sort | uniq -c | sort -rn | head -15
            echo "--- first server traceback ---"
            grep -m1 -A40 "Unhandled exception while processing request" pytest.log | cut -c1-200
          } > summary.txt
          msg=$(cat summary.txt)
          msg="${msg//'%'/'%25'}"
          msg="${msg//$'\n'/'%0A'}"
          echo "::${level} title=pytest result::${msg}"
