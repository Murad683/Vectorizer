[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

# PyMuPDF ships partial typing; its constructors are untyped.
[[tool.mypy.overrides]]
module = "app.core.ingestion.pdf_extractor"
disallow_untyped_calls = false

# python-pptx's connector API (begin_connect/end_connect) is untyped.
[[tool.mypy.overrides]]
module = "app.core.render.pptx_shapes"
disallow_untyped_calls = false
