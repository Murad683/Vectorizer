# Vectorizer — production stack for a shared VPS.
#
# Isolated from the other projects on the host: own directory (/opt/vectorizer),
# own network, own named volumes, own port, CPU/RAM limits. The only published
# local port is 127.0.0.1:4300 (health checks); public traffic arrives through
# this project's own Cloudflare tunnel (the cloudflared service below).
#
# Config: /opt/vectorizer/.env on the server (chmod 600, NOT committed). Template:
# deploy/env.production.example. Compose reads it for ${...} interpolation and the
# backend receives it via env_file.
name: vectorizer

services:
  postgres:
    image: postgres:16-alpine
    container_name: vectorizer-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - vectorizer_pgdata:/var/lib/postgresql/data
    networks: [vectorizer_net]
    cpus: 0.5
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: &logging
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    # intentionally no host port mapping — only the backend can reach the DB

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: vectorizer-backend:latest
    container_name: vectorizer-backend
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      ENVIRONMENT: prod
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      # .env also holds the tunnel token; the backend never needs it, so blank
      # it here (environment wins over env_file) instead of handing it over.
      TUNNEL_TOKEN: ""
    volumes:
      - vectorizer_data:/app/data
    networks: [vectorizer_net]
    depends_on:
      postgres:
        condition: service_healthy
    cpus: 2
    mem_limit: 1536m
    pids_limit: 512
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: *logging

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    image: vectorizer-web:latest
    container_name: vectorizer-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:4300:8080"
    networks: [vectorizer_net]
    depends_on:
      backend:
        condition: service_started
    cpus: 0.25
    mem_limit: 64m
    pids_limit: 128
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging

  # This project's own Cloudflare tunnel (separate from any other tunnel on the
  # host). It dials out to Cloudflare and reaches the site as http://web:8080
  # inside vectorizer_net; no host port is published.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.5
    container_name: vectorizer-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 --metrics 0.0.0.0:60123 run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in /opt/vectorizer/.env}
    networks: [vectorizer_net]
    depends_on:
      web:
        condition: service_healthy
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 64
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:60123", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging

networks:
  vectorizer_net:
    name: vectorizer_net

volumes:
  vectorizer_pgdata:
    name: vectorizer_pgdata
  vectorizer_data:
    name: vectorizer_data
