# Real client address. Traffic arrives through a tunnel on localhost, so the
# TCP peer is always the same; the proxy in front puts the visitor's address
# into CF-Connecting-IP. Falls back to the TCP peer when the header is absent.
map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

# 10 login attempts per minute per client address.
limit_req_zone $client_ip zone=login:1m rate=10r/m;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Max upload is 30 MB (MAX_UPLOAD_SIZE_MB); leave headroom for multipart overhead.
    client_max_body_size 35m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    limit_req_status 429;
    limit_req_log_level warn;
    # JSON body in the same shape as the backend errors, so the UI can show it.
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"error_code":"too_many_requests","message":"Çox sayda giriş cəhdi. Bir az gözləyib yenidən cəhd edin."}';
    }

    # The API schema and interactive docs are not public.
    location ~ ^/api/(docs|redoc|openapi\.json)(/|$) {
        return 404;
    }

    # Login: same proxying as the rest of the API, plus the rate limit. A
    # separate location (not a map on the URI) because the limit is checked
    # after the rewrite inside api_proxy.inc, which changes $uri.
    location ~ ^/api/auth/login/?$ {
        limit_req zone=login burst=5 nodelay;
        include /etc/nginx/api_proxy.inc;
    }

    # /api/foo -> backend /foo (same prefix rewrite as the Vite dev proxy).
    location /api/ {
        include /etc/nginx/api_proxy.inc;
    }

    # Hashed build assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
