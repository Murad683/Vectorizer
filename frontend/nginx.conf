server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Max upload is 30 MB (MAX_UPLOAD_SIZE_MB); leave headroom for multipart overhead.
    client_max_body_size 35m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # /api/foo -> backend /foo (same prefix rewrite as the Vite dev proxy).
    # Docker's embedded DNS resolves "backend"; resolving per request lets nginx
    # start even if the backend is briefly down.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $upstream http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        # The TLS-terminating proxy in front sets this to https.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Hashed build assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
